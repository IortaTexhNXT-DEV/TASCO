name: CI

on:
  push:
    branches: [main, "claude/**", "release/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tests & coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - name: Unit, integration, API & security tests with coverage (≥80% lines/functions, ≥70% branches)
        run: npm run test:coverage
      - name: OpenAPI contract is up to date
        run: |
          node src/jobs/cli.js openapi
          git diff --exit-code docs/api/openapi.json

  postgres:
    name: PostgreSQL adapter tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: tasco_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:pg
        env: { TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/tasco_test }

  performance:
    name: Performance smoke (p95 budget)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:perf
        env: { DURATION_MS: "15000", CONCURRENCY: "25", P95_BUDGET_MS: "300" }

  sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions: { security-events: write, contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: javascript-typescript, queries: security-extended }
      - uses: github/codeql-action/analyze@v3

  dependencies:
    name: Dependency & secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - name: Dependency review (PRs)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with: { fail-on-severity: high }
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  container:
    name: Image build, scan, SBOM & DAST baseline
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tasco-growth-platform:${{ github.sha }} .
      - name: Trivy image scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: tasco-growth-platform:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with: { image: "tasco-growth-platform:${{ github.sha }}", format: cyclonedx-json, output-file: sbom.cdx.json }
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: sbom.cdx.json }
      - name: Start app for DAST (demo data, in-memory)
        run: |
          docker run -d --name app -p 8080:8080 -e NODE_ENV=development -e DEMO_MODE=true \
            -e JWT_SECRET=ci-only-secret-0123456789abcdef0123456789 \
            -e DATA_KEYS=k1:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY= \
            -e BLIND_INDEX_KEY=ZmVkY2JhOTg3NjU0MzIxMGZlZGNiYTk4NzY1NDMyMTA= \
            tasco-growth-platform:${{ github.sha }}
          for i in $(seq 1 30); do curl -fs http://localhost:8080/health/ready && break; sleep 2; done
      - name: OWASP ZAP baseline (DAST)
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:8080
          fail_action: false
          allow_issue_writing: false

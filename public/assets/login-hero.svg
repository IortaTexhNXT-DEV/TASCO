<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 330 960 750" preserveAspectRatio="xMidYMax meet" role="img" aria-label="Car driving on a Vietnamese expressway through a VETC toll gantry at dusk, protected by a TASCO shield">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14204a"/>
      <stop offset="0.45" stop-color="#213368"/>
      <stop offset="0.75" stop-color="#2f6f8f"/>
      <stop offset="1" stop-color="#70cac8"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26335c"/>
      <stop offset="1" stop-color="#0d1430"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3c4" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#ffd27a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fe0dc"/>
      <stop offset="1" stop-color="#3fa7a3"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6d0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff6d0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- low sun / city glow -->
  <circle cx="640" cy="560" r="240" fill="url(#sun)"/>
  <!-- mountains (northern Vietnam limestone karsts) -->
  <path d="M-2000 640 L-2000 610 L0 610 L0 600 C60 480 110 470 150 560 C180 430 240 420 280 540 C320 470 360 470 400 580 L400 640 L0 640Z" fill="#1b2a5a" opacity="0.85"/>
  <path d="M560 610 C610 470 660 450 700 560 C730 500 770 470 820 520 C860 440 920 450 960 520 L960 610 L2960 610 L2960 640 L560 640Z" fill="#1b2a5a" opacity="0.85"/>
  <!-- city skyline -->
  <g fill="#17244f">
    <rect x="380" y="520" width="34" height="120"/><rect x="420" y="490" width="26" height="150"/><rect x="452" y="540" width="40" height="100"/>
    <rect x="498" y="470" width="22" height="170"/><rect x="526" y="510" width="36" height="130"/><rect x="568" y="545" width="28" height="95"/>
  </g>
  <g fill="#ffd27a" opacity="0.65">
    <rect x="386" y="535" width="4" height="4"/><rect x="398" y="555" width="4" height="4"/><rect x="428" y="505" width="4" height="4"/>
    <rect x="436" y="530" width="4" height="4"/><rect x="505" y="490" width="4" height="4"/><rect x="532" y="525" width="4" height="4"/>
    <rect x="545" y="560" width="4" height="4"/><rect x="460" y="560" width="4" height="4"/>
  </g>

  <!-- ground -->
  <rect x="-2000" y="630" width="4960" height="450" fill="#121d45"/>
  <!-- expressway in perspective -->
  <path d="M430 630 L530 630 L960 1080 L0 1080Z" fill="url(#road)"/>
  <path d="M470 630 L490 630 L560 1080 L400 1080Z" fill="none"/>
  <g stroke="#ffd27a" stroke-width="6" stroke-linecap="round" opacity="0.9">
    <line x1="480" y1="660" x2="480" y2="690"/><line x1="480" y1="730" x2="480" y2="780"/>
    <line x1="480" y1="840" x2="480" y2="920"/><line x1="480" y1="990" x2="480" y2="1080"/>
  </g>
  <g stroke="#e9eefb" stroke-width="4" opacity="0.6">
    <line x1="436" y1="632" x2="40" y2="1080"/><line x1="524" y1="632" x2="920" y2="1080"/>
  </g>

  <!-- VETC toll gantry -->
  <g>
    <rect x="300" y="610" width="14" height="150" fill="#c9d1e0"/>
    <rect x="646" y="610" width="14" height="150" fill="#c9d1e0"/>
    <rect x="292" y="590" width="376" height="34" rx="4" fill="#e9eefb"/>
    <rect x="300" y="596" width="360" height="22" rx="3" fill="#213368"/>
    <text x="480" y="613" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#70cac8" text-anchor="middle" letter-spacing="6">VETC · ETC</text>
    <g fill="#70cac8"><circle cx="360" cy="634" r="5"/><circle cx="430" cy="634" r="5"/><circle cx="530" cy="634" r="5"/><circle cx="600" cy="634" r="5"/></g>
  </g>

  <!-- headlight beams -->
  <path d="M440 820 L360 640 L420 640 Z" fill="url(#beam)" opacity="0.5"/>
  <path d="M520 820 L540 640 L600 640 Z" fill="url(#beam)" opacity="0.5"/>

  <!-- car (rear view) -->
  <g transform="translate(480 860)">
    <ellipse cx="0" cy="92" rx="170" ry="18" fill="#000" opacity="0.35"/>
    <path d="M-150 40 Q-150 0 -110 -10 L-80 -70 Q-70 -92 -40 -92 L40 -92 Q70 -92 80 -70 L110 -10 Q150 0 150 40 L150 78 Q150 90 138 90 L-138 90 Q-150 90 -150 78 Z" fill="#f4f6fb"/>
    <path d="M-70 -66 Q-62 -82 -40 -82 L40 -82 Q62 -82 70 -66 L88 -18 L-88 -18 Z" fill="#213368"/>
    <rect x="-128" y="14" width="56" height="18" rx="6" fill="#d9363e"/>
    <rect x="72" y="14" width="56" height="18" rx="6" fill="#d9363e"/>
    <rect x="-46" y="40" width="92" height="26" rx="4" fill="#ffffff" stroke="#213368" stroke-width="3"/>
    <text x="0" y="60" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#213368" text-anchor="middle">30A-123.45</text>
    <rect x="-140" y="70" width="280" height="10" rx="4" fill="#c9d1e0"/>
    <rect x="-150" y="78" width="38" height="20" rx="5" fill="#0d1430"/>
    <rect x="112" y="78" width="38" height="20" rx="5" fill="#0d1430"/>
    <rect x="-18" y="-80" width="36" height="8" rx="2" fill="#70cac8"/>
  </g>

  <!-- protective shield -->
  <g transform="translate(800 470) scale(0.8)">
    <circle r="120" fill="#70cac8" opacity="0.12"/>
    <circle r="88" fill="#70cac8" opacity="0.14"/>
    <path d="M0 -70 L56 -48 L56 6 Q56 52 0 78 Q-56 52 -56 6 L-56 -48 Z" fill="url(#shield)" stroke="#e9fbfa" stroke-width="4"/>
    <path d="M-24 2 L-6 20 L28 -16" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

</svg>

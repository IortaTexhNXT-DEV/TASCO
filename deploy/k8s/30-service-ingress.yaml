apiVersion: v1
kind: Service
metadata: { name: tasco-growth-api, namespace: tasco-growth }
spec:
  selector: { app: tasco-growth-api }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tasco-growth
  namespace: tasco-growth
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
    nginx.ingress.kubernetes.io/limit-rps: "50"            # edge rate limit (shared across replicas)
    nginx.ingress.kubernetes.io/enable-modsecurity: "true"  # WAF (OWASP CRS)
    nginx.ingress.kubernetes.io/enable-owasp-core-rules: "true"
spec:
  ingressClassName: nginx
  tls: [{ hosts: [growth.tascoinsurance.com.vn], secretName: tasco-growth-tls }]
  rules:
    - host: growth.tascoinsurance.com.vn
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: tasco-growth-api, port: { name: http } } } }

# Batch workloads. Times are UTC (Vietnam = UTC+7):
#   migrate   – PreSync hook before every rollout
#   journeys  – 01:15 UTC = 08:15 local (inside the 08:00–20:00 contact window)
#   recompute – 17:30 UTC = 00:30 local (nightly re-score with active rules)
#   reconcile – 19:00 UTC = 02:00 local (orders ↔ payments ↔ policies)
#   retention – 20:00 UTC = 03:00 local (retention rule set)
#   relay     – every 5 min safety net for the outbox (API pods also relay continuously)
#   sync-catalogue – 18:00 UTC = 01:00 local (pull TASCO core product catalogue → propose a
#                    `products` rule-set version for maker-checker approval; never auto-activated)
apiVersion: batch/v1
kind: Job
metadata:
  name: tasco-growth-migrate
  namespace: tasco-growth
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: job
        image: REGISTRY/tasco-growth-platform:IMAGE_TAG
        args:
        - node
        - src/jobs/cli.js
        - migrate
        envFrom:
        - configMapRef:
            name: tasco-growth-config
        env:
        - name: DATABASE_URL_FILE
          value: /run/secrets/tasco/DATABASE_URL
        - name: JWT_SECRET_FILE
          value: /run/secrets/tasco/JWT_SECRET
        - name: DATA_KEYS_FILE
          value: /run/secrets/tasco/DATA_KEYS
        - name: BLIND_INDEX_KEY_FILE
          value: /run/secrets/tasco/BLIND_INDEX_KEY
        - name: TASCO_CORE_CLIENT_SECRET_FILE
          value: /run/secrets/tasco/TASCO_CORE_CLIENT_SECRET
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 768Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: secrets
          mountPath: /run/secrets/tasco
          readOnly: true
      volumes:
      - name: secrets
        secret:
          secretName: tasco-growth-secrets
          defaultMode: 256
---

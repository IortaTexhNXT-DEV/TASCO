# Zero-trust networking: default deny; allow only ingress-controller → api,
# api → Postgres, api → DNS and the approved external integration egress proxy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny, namespace: tasco-growth }
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: tasco-growth-api, namespace: tasco-growth }
spec:
  podSelector: { matchLabels: { app: tasco-growth-api } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
      ports: [{ port: 8080 }]
  egress:
    - to: [{ ipBlock: { cidr: 10.20.0.0/24 } }]          # managed PostgreSQL subnet (adjust)
      ports: [{ port: 5432 }]
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: egress-proxy } } }]  # VETC, TASCO core, Zalo, SMS, voice-AI
      ports: [{ port: 3128 }]
    - to: [{ namespaceSelector: {}, podSelector: { matchLabels: { k8s-app: kube-dns } } }]
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]

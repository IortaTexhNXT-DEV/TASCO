# Secrets come from the cloud secret manager / Vault via External Secrets Operator.
# They are mounted as files (…_FILE convention), never baked into images or ConfigMaps.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: tasco-growth-secrets, namespace: tasco-growth }
spec:
  refreshInterval: 1h
  secretStoreRef: { name: tasco-secret-store, kind: ClusterSecretStore }
  target: { name: tasco-growth-secrets }
  data:
    - { secretKey: DATABASE_URL, remoteRef: { key: tasco-growth/database-url } }
    - { secretKey: JWT_SECRET, remoteRef: { key: tasco-growth/jwt-secret } }
    - { secretKey: DATA_KEYS, remoteRef: { key: tasco-growth/data-keys } }
    - { secretKey: BLIND_INDEX_KEY, remoteRef: { key: tasco-growth/blind-index-key } }
    - { secretKey: METRICS_TOKEN, remoteRef: { key: tasco-growth/metrics-token } }
    - { secretKey: TASCO_CORE_CLIENT_SECRET, remoteRef: { key: tasco-growth/tasco-core-client-secret } }

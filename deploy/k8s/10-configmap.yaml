apiVersion: v1
kind: ConfigMap
metadata: { name: tasco-growth-config, namespace: tasco-growth }
data:
  NODE_ENV: production
  PORT: "8080"
  PUBLIC_BASE_URL: https://growth.tascoinsurance.com.vn
  LOG_LEVEL: info
  DATABASE_SSL: "true"
  DB_POOL_MAX: "10"
  MIGRATE_ON_START: "false"        # migrations run in the pre-deploy Job
  TRUST_PROXY: "true"
  TRUST_PROXY_HOPS: "1"
  RATE_LIMIT_MAX: "300"
  RATE_LIMIT_LOGIN_MAX: "10"
  DEMO_MODE: "false"
  # TASCO core is the system of record for products and rating (fail closed if unavailable).
  RATING_SOURCE: core
  TASCO_CORE_BASE_URL: https://core-api.tascoinsurance.com.vn   # adjust to the TASCO core API gateway
  TASCO_CORE_CLIENT_ID: tasco-growth-platform
  TASCO_CORE_TIMEOUT_MS: "5000"

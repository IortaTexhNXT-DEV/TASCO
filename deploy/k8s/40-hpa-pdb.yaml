apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: tasco-growth-api, namespace: tasco-growth }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: tasco-growth-api }
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - { type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } } }
    - { type: Resource, resource: { name: memory, target: { type: Utilization, averageUtilization: 75 } } }
  behavior:
    scaleDown: { stabilizationWindowSeconds: 300 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: tasco-growth-api, namespace: tasco-growth }
spec:
  minAvailable: 2
  selector: { matchLabels: { app: tasco-growth-api } }
